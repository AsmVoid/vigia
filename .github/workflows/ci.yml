name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: vigia_secret
          POSTGRES_DB: vigia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrações do Prisma e Views SQL
        env:
          DATABASE_URL: "postgresql://vigia:vigia_secret@localhost:5432/vigia_db?schema=public"
          BETTER_AUTH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          npx prisma migrate deploy
          npm run db:views

      - name: Verificação de Tipos TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://vigia:vigia_secret@localhost:5432/vigia_db?schema=public"
          BETTER_AUTH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build
